<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- ================= SEO ================= -->
    <title>Rafa Fotos | Fotografia Profissional</title>
    <meta
      name="description"
      content="Rafa Fotos — Fotografia profissional para casamentos, ensaios, gestantes, newborn, infantil e eventos. Registre seus momentos especiais com qualidade, experiência e sensibilidade."
    />
    <meta name="theme-color" content="#050505" />
    <!-- Depois de publicar, coloque aqui o endereço final do site (ex.: https://www.seudominio.com.br/) -->
    <!-- <link rel="canonical" href="https://www.seudominio.com.br/" /> -->

    <!-- ================= FAVICON (ícone da aba) =================
         Para trocar, substitua o arquivo public/favicon.svg (ou aponte para outro arquivo aqui). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- ================= OPEN GRAPH (prévia ao compartilhar no WhatsApp, Facebook, etc.) =================
         IMPORTANTE: depois de publicar, troque "/images/og-image.jpg" pelo endereço completo,
         ex.: https://www.seudominio.com.br/images/og-image.jpg  (algumas redes exigem o endereço completo). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Rafa Fotos" />
    <meta property="og:title" content="Rafa Fotos | Fotografia Profissional" />
    <meta
      property="og:description"
      content="Rafa Fotos — Fotografia profissional para casamentos, ensaios, gestantes, newborn, infantil e eventos. Registre seus momentos especiais com qualidade, experiência e sensibilidade."
    />
    <meta property="og:image" content="/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ================= FONTES (Google Fonts) ================= -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Dados estruturados para o Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Rafa Fotos",
        "description": "Fotografia profissional para casamentos, ensaios, gestantes, newborn, infantil e eventos.",
        "image": "/images/og-image.jpg",
        "address": { "@type": "PostalAddress", "addressLocality": "Orós", "addressRegion": "CE", "addressCountry": "BR" },
        "sameAs": ["https://www.instagram.com/rafafotosoros"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ative o JavaScript para ver o site do Rafa Fotos.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
